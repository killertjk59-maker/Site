<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>OSHONA — Панели админ</title>
<link rel="stylesheet" href="/admin.css">
</head>
<body>
<div class="topbar">
  <div class="logo"><span>O</span>SHONA · ADMIN</div>
  <div class="top-actions"><a href="/" class="back-link">← Сайт</a><button id="logoutBtn" type="button" hidden>Баромадан</button></div>
</div>

<div class="wrap">
  <!-- ВОРИД -->
  <form class="login-card" id="loginCard" autocomplete="on">
    <h1>Воридшавӣ</h1>
    <p>Танҳо барои кормандони OSHONA</p>
    <input id="loginUser" name="username" placeholder="Логин" value="admin" autocomplete="username" maxlength="100">
    <input id="loginPass" name="password" type="password" placeholder="Парол" autocomplete="current-password" maxlength="200">
    <button type="submit">Ворид шудан →</button>
    <p id="loginErr" class="err" hidden></p>
  </form>

  <!-- ИЛОВА -->
  <div id="app" hidden>
    <div id="demoBanner" class="banner warn" hidden>Меню ҳанӯз намунавӣ (demo) аст. Нархҳо ва таркибро тасдиқ ё таомҳоро нест кунед — демо ба мизоҷон ҳамчун маълумоти воқеӣ нишон дода нашавад.</div>
    <div class="stats" id="stats"></div>
    <div class="tabs" role="tablist">
      <button class="active" data-tab="orders" type="button">🧾 Фармоишҳо</button>
      <button data-tab="reserv" type="button">📅 Бронкунӣ</button>
      <button data-tab="menu" type="button">🍽️ Меню</button>
      <button data-tab="promo" type="button">🎟 Промо</button>
      <button data-tab="report" type="button">💰 Ҳисобот</button>
      <button data-tab="forecast" type="button">📈 Пешгӯӣ</button>
    </div>
    <div class="toolbar">
      <span id="tabTitle" class="tab-title"></span>
      <span><small id="verTag" class="muted"></small><button id="refreshBtn" type="button">↻ Навсозӣ</button></span>
    </div>
    <div id="content"></div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>
<script src="/admin.js"></script>
</body>
</html>
